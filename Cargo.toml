[package]
name = "destr"
version = "0.1.0"
edition = "2021"
description = "Bevy 3D 基础场景效果示例仓库：可破坏、可交互、面向游戏项目参考"
license = "MIT OR Apache-2.0"

[lib]
name = "destr"
path = "src/lib.rs"

# 每个 case 一个 binary，运行：
#   cargo run --bin destructible_wall
#   cargo run --bin destructible_wall -- --demo
[[bin]]
name = "destructible_wall"
path = "src/cases/destructible_wall.rs"

# Case 02: 场景基础元素陈列
[[bin]]
name = "basic_elements_showcase"
path = "src/cases/basic_elements_showcase.rs"

# Case 03: 半圆拱门（12 块 ArchBrick 拼拱圈 + 砖砌支座 + 基础）
[[bin]]
name = "semicircular_arch"
path = "src/cases/semicircular_arch.rs"

# Case 04: 小树林（N 棵不同 seed/bend 的歪曲树干 + 树根乱石）
[[bin]]
name = "small_grove"
path = "src/cases/small_grove.rs"

[dependencies]
bevy = { version = "0.18", default-features = true }

# Compile bevy fixtures fast enough to actually run.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
